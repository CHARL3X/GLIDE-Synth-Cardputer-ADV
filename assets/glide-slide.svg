<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 390" role="img" aria-label="The slide: hold one key, tap another on the same row and the voice glides there; release and it glides back. The bottom row latches a chord progression.">
  <style>
    text { font-family: Consolas, 'Cascadia Mono', 'SF Mono', Menlo, monospace; }
    .voice { animation: slide 6s cubic-bezier(.55,0,.25,1) infinite; }
    @keyframes slide {
      0%   { transform: translateX(0);     opacity: 0; }
      6%   { opacity: .95; }
      26%  { transform: translateX(0); }
      46%  { transform: translateX(186px); }
      62%  { transform: translateX(186px); }
      82%  { transform: translateX(0); }
      94%  { transform: translateX(0); opacity: .95; }
      100% { transform: translateX(0); opacity: 0; }
    }
    .latch { animation: latch 3.2s ease-in-out infinite alternate; }
    @keyframes latch { from { opacity: .35; } to { opacity: .9; } }
    @media (prefers-reduced-motion: reduce) {
      .voice { animation: none; opacity: .9; transform: translateX(186px); }
      .latch { animation: none; opacity: .7; }
    }
  </style>
  <defs>
    <marker id="p1a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#4fb8d6"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="660" height="390" rx="16" fill="#0e1116"/>

  <!-- labels above -->
  <text x="130" y="26" fill="#4fd68f" font-size="14" text-anchor="middle" font-weight="600">hold one key</text>
  <text x="316" y="26" fill="#aeb8c2" font-size="14" text-anchor="middle">tap another, same row</text>

  <!-- key grid: string rows -->
  <g fill="#171c23" stroke="#29323d">
    <rect x="40"  y="40" width="56" height="44" rx="7"/><rect x="102" y="40" width="56" height="44" rx="7"/>
    <rect x="164" y="40" width="56" height="44" rx="7"/><rect x="226" y="40" width="56" height="44" rx="7"/>
    <rect x="288" y="40" width="56" height="44" rx="7"/><rect x="350" y="40" width="56" height="44" rx="7"/>
    <rect x="412" y="40" width="56" height="44" rx="7"/><rect x="474" y="40" width="56" height="44" rx="7"/>
    <rect x="40"  y="92" width="56" height="44" rx="7"/>
    <rect x="164" y="92" width="56" height="44" rx="7"/><rect x="226" y="92" width="56" height="44" rx="7"/>
    <rect x="350" y="92" width="56" height="44" rx="7"/>
    <rect x="412" y="92" width="56" height="44" rx="7"/><rect x="474" y="92" width="56" height="44" rx="7"/>
    <rect x="40"  y="144" width="56" height="44" rx="7"/><rect x="102" y="144" width="56" height="44" rx="7"/>
    <rect x="164" y="144" width="56" height="44" rx="7"/><rect x="226" y="144" width="56" height="44" rx="7"/>
    <rect x="288" y="144" width="56" height="44" rx="7"/><rect x="350" y="144" width="56" height="44" rx="7"/>
    <rect x="412" y="144" width="56" height="44" rx="7"/><rect x="474" y="144" width="56" height="44" rx="7"/>
  </g>

  <!-- the held key and the tapped key -->
  <rect x="102" y="92" width="56" height="44" rx="7" fill="#1d3a2b" stroke="#4fd68f" stroke-width="2"/>
  <rect x="288" y="92" width="56" height="44" rx="7" fill="none" stroke="#4fd68f" stroke-width="1.5" stroke-dasharray="5 4" opacity=".75"/>

  <!-- glide up + glide back -->
  <line x1="162" y1="106" x2="282" y2="106" stroke="#4fb8d6" stroke-width="2" marker-end="url(#p1a)"/>
  <line x1="282" y1="124" x2="162" y2="124" stroke="#4fb8d6" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#p1a)" opacity=".8"/>
  <text x="40" y="212" fill="#aeb8c2" font-size="12">the voice glides up to the tapped key &#8212; no re-attack</text>
  <text x="40" y="230" fill="#5c6875" font-size="12">release it and the voice glides back down</text>

  <!-- the moving voice -->
  <g class="voice"><rect x="102" y="92" width="56" height="44" rx="7" fill="#4fd68f" opacity=".28"/></g>

  <!-- string hints -->
  <text x="556" y="66"  fill="#5c6875" font-size="12">&#183; strings,</text>
  <text x="556" y="82"  fill="#5c6875" font-size="12">&#160;&#160;in fourths</text>

  <!-- jam row (bottom) -->
  <g fill="#101a21" stroke="#2a4452">
    <rect x="40"  y="252" width="56" height="44" rx="7"/><rect x="102" y="252" width="56" height="44" rx="7"/>
    <rect x="226" y="252" width="56" height="44" rx="7"/><rect x="288" y="252" width="56" height="44" rx="7"/>
    <rect x="350" y="252" width="56" height="44" rx="7"/><rect x="412" y="252" width="56" height="44" rx="7"/>
    <rect x="474" y="252" width="56" height="44" rx="7"/>
  </g>
  <rect class="latch" x="164" y="252" width="56" height="44" rx="7" fill="#123240" stroke="#4fb8d6" stroke-width="2"/>
  <text x="192" y="280" class="latch" fill="#4fb8d6" font-size="12" text-anchor="middle">&#9679;</text>
  <text x="556" y="278" fill="#4fb8d6" font-size="12">&#183; the jam row</text>
  <text x="40" y="320" fill="#5c6875" font-size="12">tap a pad once &#8212; a chord progression backs you while you slide above it</text>

  <!-- caption -->
  <text x="40" y="352" fill="#aeb8c2" font-size="14">one finger holds, one taps. <tspan fill="#4fd68f">the pitch glides between them</tspan> like a</text>
  <text x="40" y="374" fill="#aeb8c2" font-size="14">finger on a string. <tspan fill="#4fb8d6">that glide is GLIDE.</tspan></text>
</svg>
