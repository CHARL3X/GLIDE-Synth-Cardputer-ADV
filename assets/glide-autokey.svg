<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-label="Autokey: the mic's chromagram finds the song's tonic, and the key rows retune under your unmoved fingers — same keys, now in the song's key">
  <style>
    text { font-family: Consolas, 'Cascadia Mono', 'SF Mono', Menlo, monospace; }
    .tonic { animation: tonic 8s ease-in-out infinite; }
    @keyframes tonic { 0%, 30% { opacity: .25; } 45%, 90% { opacity: 1; } 100% { opacity: .25; } }
    .oldk { animation: oldk 8s ease-in-out infinite; }
    .newk { animation: newk 8s ease-in-out infinite; }
    @keyframes oldk { 0%, 40% { opacity: 1; } 50%, 92% { opacity: 0; } 100% { opacity: 1; } }
    @keyframes newk { 0%, 45% { opacity: 0; } 55%, 88% { opacity: 1; } 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .tonic { animation: none; opacity: 1; }
      .oldk { animation: none; opacity: 0; }
      .newk { animation: none; opacity: 1; }
    }
  </style>
  <rect x="0" y="0" width="760" height="300" rx="16" fill="#0e1116"/>

  <!-- chromagram -->
  <text x="168" y="40" fill="#aeb8c2" font-size="13" text-anchor="middle">the twelve notes it heard</text>
  <g fill="#3a4450">
    <rect x="60"  y="138" width="12" height="52"/>
    <rect x="78"  y="182" width="12" height="8"/>
    <rect x="114" y="180" width="12" height="10"/>
    <rect x="132" y="154" width="12" height="36"/>
    <rect x="150" y="132" width="12" height="58"/>
    <rect x="168" y="181" width="12" height="9"/>
    <rect x="186" y="140" width="12" height="50"/>
    <rect x="204" y="183" width="12" height="7"/>
    <rect x="222" y="118" width="12" height="72"/>
    <rect x="240" y="178" width="12" height="12"/>
    <rect x="258" y="162" width="12" height="28"/>
  </g>
  <rect class="tonic" x="96" y="102" width="12" height="88" fill="#4fd68f"/>
  <text class="tonic" x="102" y="92" fill="#4fd68f" font-size="11" text-anchor="middle">tonic</text>
  <line x1="56" y1="190" x2="274" y2="190" stroke="#29323d" stroke-width="1.5"/>
  <g fill="#5c6875" font-size="9" text-anchor="middle">
    <text x="66"  y="204">C</text><text x="102" y="204">D</text><text x="138" y="204">E</text>
    <text x="156" y="204">F</text><text x="192" y="204">G</text><text x="228" y="204">A</text>
    <text x="264" y="204">B</text>
  </g>
  <text x="168" y="232" fill="#5c6875" font-size="12" text-anchor="middle">the notes the song leans on</text>

  <text x="310" y="150" fill="#d9a04a" font-size="16" text-anchor="middle">&#8594;</text>

  <!-- the retuning key row -->
  <g text-anchor="middle" font-size="13">
    <text class="oldk" x="526" y="64" fill="#5c6875">playing in: A minor pentatonic</text>
    <text class="newk" x="526" y="64" fill="#4fd68f">retuned: D minor pentatonic</text>
  </g>
  <g fill="#171c23" stroke="#29323d">
    <rect x="340" y="84" width="48" height="44" rx="7"/><rect x="394" y="84" width="48" height="44" rx="7"/>
    <rect x="448" y="84" width="48" height="44" rx="7"/><rect x="502" y="84" width="48" height="44" rx="7"/>
    <rect x="556" y="84" width="48" height="44" rx="7"/><rect x="610" y="84" width="48" height="44" rx="7"/>
    <rect x="664" y="84" width="48" height="44" rx="7"/>
  </g>
  <g class="oldk" fill="#cfd6dd" font-size="16" text-anchor="middle">
    <text x="364" y="112">A</text><text x="418" y="112">C</text><text x="472" y="112">D</text>
    <text x="526" y="112">E</text><text x="580" y="112">G</text><text x="634" y="112">A</text>
    <text x="688" y="112">C</text>
  </g>
  <g class="newk" fill="#4fd68f" font-size="16" text-anchor="middle">
    <text x="364" y="112">D</text><text x="418" y="112">F</text><text x="472" y="112">G</text>
    <text x="526" y="112">A</text><text x="580" y="112">C</text><text x="634" y="112">D</text>
    <text x="688" y="112">F</text>
  </g>
  <circle cx="472" cy="106" r="17" fill="none" stroke="#d9a04a" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="472" y="152" fill="#d9a04a" font-size="11" text-anchor="middle">your finger hasn&#8217;t moved</text>

  <text x="340" y="188" fill="#aeb8c2" font-size="12">same keys, same shapes &#8212; every key is still</text>
  <text x="340" y="206" fill="#aeb8c2" font-size="12">a scale tone, now in the song&#8217;s key</text>

  <!-- the two gestures -->
  <rect x="60" y="252" width="52" height="22" rx="5" fill="#14211b" stroke="#2a4c3c"/>
  <text x="86" y="267" fill="#4fd68f" font-size="13" text-anchor="middle">fn+k</text>
  <text x="122" y="267" fill="#aeb8c2" font-size="13">tap: changes the key</text>
  <rect x="340" y="252" width="96" height="22" rx="5" fill="#14211b" stroke="#2a4c3c"/>
  <text x="388" y="267" fill="#4fd68f" font-size="13" text-anchor="middle">fn+k hold</text>
  <text x="446" y="267" fill="#aeb8c2" font-size="13">LISTEN retunes you by ear</text>
</svg>
