<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-label="Rolling a sound: one tap of Randomize commits to a character, paints every parameter inside that character's bounds, and lands a named, playable sound">
  <style>
    text { font-family: Consolas, 'Cascadia Mono', 'SF Mono', Menlo, monospace; }
    .reel { animation: reel 7s cubic-bezier(.2,.7,.3,1) infinite; }
    @keyframes reel {
      0%, 8% { transform: translateY(0); }
      52%    { transform: translateY(-216px); }
      64%    { transform: translateY(-198px); }
      100%   { transform: translateY(-198px); }
    }
    .paintA { animation: paintA 7s steps(1) infinite; }
    .paintB { animation: paintB 7s steps(1) infinite; }
    .paintC { animation: paintC 7s steps(1) infinite; }
    .paintD { animation: paintD 7s steps(1) infinite; }
    @keyframes paintA { 0% { transform: translateX(0); } 64% { transform: translateX(34px); } 100% { transform: translateX(34px); } }
    @keyframes paintB { 0% { transform: translateX(0); } 66% { transform: translateX(-22px); } 100% { transform: translateX(-22px); } }
    @keyframes paintC { 0% { transform: translateX(0); } 68% { transform: translateX(18px); } 100% { transform: translateX(18px); } }
    @keyframes paintD { 0% { transform: translateX(0); } 70% { transform: translateX(-30px); } 100% { transform: translateX(-30px); } }
    @media (prefers-reduced-motion: reduce) {
      .reel { animation: none; transform: translateY(-198px); }
      .paintA, .paintB, .paintC, .paintD { animation: none; }
    }
  </style>
  <defs>
    <clipPath id="reelwin"><rect x="64" y="128" width="132" height="58" rx="4"/></clipPath>
  </defs>
  <rect x="0" y="0" width="760" height="330" rx="16" fill="#0e1116"/>

  <!-- 1: the tap -->
  <text x="130" y="52" fill="#aeb8c2" font-size="13" text-anchor="middle">one tap</text>
  <rect x="70" y="66" width="120" height="30" rx="6" fill="#1d3a2b" stroke="#4fd68f" stroke-width="1.5"/>
  <text x="130" y="86" fill="#4fd68f" font-size="14" text-anchor="middle" font-weight="600">Randomize</text>

  <!-- the character reel -->
  <rect x="64" y="128" width="132" height="58" rx="4" fill="#0b0e13" stroke="#1c232c"/>
  <g clip-path="url(#reelwin)">
    <g class="reel" fill="#aeb8c2" font-size="14" text-anchor="middle">
      <text x="130" y="162">pluck</text>
      <text x="130" y="180">bell</text>
      <text x="130" y="198">pad</text>
      <text x="130" y="216">bass</text>
      <text x="130" y="234">acid</text>
      <text x="130" y="252">lead</text>
      <text x="130" y="270">brass</text>
      <text x="130" y="288">chip</text>
      <text x="130" y="306">whistle</text>
      <text x="130" y="324">organ</text>
      <text x="130" y="342">keys</text>
      <text x="130" y="360">wobble</text>
      <text x="130" y="378">strings</text>
      <text x="130" y="396">wild</text>
    </g>
  </g>
  <rect x="64" y="148" width="132" height="20" fill="none" stroke="#4fd68f" stroke-width="1.5" rx="3"/>
  <text x="130" y="212" fill="#aeb8c2" font-size="12" text-anchor="middle">it commits to a</text>
  <text x="130" y="228" fill="#aeb8c2" font-size="12" text-anchor="middle">character first</text>

  <text x="235" y="160" fill="#4fb8d6" font-size="16" text-anchor="middle">&#8594;</text>

  <!-- 2: painting inside the bounds -->
  <text x="386" y="52" fill="#aeb8c2" font-size="13" text-anchor="middle">then paints inside its bounds</text>
  <g font-size="11" fill="#5c6875">
    <text x="278" y="96">cutoff</text>
    <text x="278" y="136">attack</text>
    <text x="278" y="176">echo</text>
    <text x="278" y="216">drive</text>
  </g>
  <g stroke="#29323d" stroke-width="2">
    <line x1="330" y1="92" x2="490" y2="92"/>
    <line x1="330" y1="132" x2="490" y2="132"/>
    <line x1="330" y1="172" x2="490" y2="172"/>
    <line x1="330" y1="212" x2="490" y2="212"/>
  </g>
  <g fill="#4fd68f" opacity=".16">
    <rect x="382" y="84" width="84" height="16" rx="3"/>
    <rect x="334" y="124" width="56" height="16" rx="3"/>
    <rect x="360" y="164" width="66" height="16" rx="3"/>
    <rect x="394" y="204" width="76" height="16" rx="3"/>
  </g>
  <g fill="none" stroke="#2a4c3c">
    <rect x="382" y="84" width="84" height="16" rx="3"/>
    <rect x="334" y="124" width="56" height="16" rx="3"/>
    <rect x="360" y="164" width="66" height="16" rx="3"/>
    <rect x="394" y="204" width="76" height="16" rx="3"/>
  </g>
  <g class="paintA"><rect x="396" y="84" width="5" height="16" rx="2" fill="#4fd68f"/></g>
  <g class="paintB"><rect x="366" y="124" width="5" height="16" rx="2" fill="#4fd68f"/></g>
  <g class="paintC"><rect x="384" y="164" width="5" height="16" rx="2" fill="#4fd68f"/></g>
  <g class="paintD"><rect x="440" y="204" width="5" height="16" rx="2" fill="#4fd68f"/></g>

  <text x="278" y="274" fill="#5c6875" font-size="12">guardrails: never dead, never shrill,</text>
  <text x="278" y="290" fill="#5c6875" font-size="12">always lands in tune</text>

  <text x="516" y="160" fill="#4fb8d6" font-size="16" text-anchor="middle">&#8594;</text>

  <!-- 3: the sound you get -->
  <rect x="540" y="66" width="196" height="132" rx="9" fill="#171c23" stroke="#29323d"/>
  <rect x="548" y="74" width="180" height="18" rx="3" fill="#1c232c"/>
  <text x="556" y="87" fill="#4fb8d6" font-size="11" letter-spacing="2">NEW SOUND</text>
  <text x="556" y="126" fill="#4fd68f" font-size="20" font-weight="700">warm-haze-3f</text>
  <text x="556" y="148" fill="#4fb8d6" font-size="13">wobble &#183; rubbery</text>
  <text x="556" y="172" fill="#aeb8c2" font-size="12">auditions instantly.</text>
  <text x="556" y="188" fill="#aeb8c2" font-size="12">love it or roll again.</text>

  <g fill="#5c6875" font-size="12" text-anchor="middle">
    <text x="638" y="218">Mutate nudges it</text>
    <text x="638" y="234">Undo brings back a keeper</text>
    <text x="638" y="250">keep it: fn+shift+key or SD</text>
  </g>

  <text x="40" y="316" fill="#aeb8c2" font-size="12">a whole new <tspan fill="#4fd68f">kind</tspan> of sound each tap &#8212; and two slots your device rolled from a seed <tspan fill="#4fb8d6">only it has.</tspan></text>
</svg>
