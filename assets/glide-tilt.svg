<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 300" role="img" aria-label="Tilt morph: lean the device forward and back to blend between two sounds; left and right adds vibrato; never pitch bend">
  <style>
    text { font-family: Consolas, 'Cascadia Mono', 'SF Mono', Menlo, monospace; }
    .rock {
      animation: rock 7s ease-in-out infinite alternate;
      transform-origin: 185px 168px; transform-box: view-box;
    }
    @keyframes rock { from { transform: rotate(-9deg); } to { transform: rotate(9deg); } }
    .blend { animation: blend 7s ease-in-out infinite alternate; }
    @keyframes blend { from { transform: translateX(0); } to { transform: translateX(268px); } }
    @media (prefers-reduced-motion: reduce) {
      .rock { animation: none; }
      .blend { animation: none; transform: translateX(134px); }
    }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#5c6875"/>
    </marker>
    <linearGradient id="morphbar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a4450"/>
      <stop offset="1" stop-color="#4fd68f"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="740" height="300" rx="16" fill="#0e1116"/>

  <!-- tilt arc -->
  <path d="M96 92 A105 105 0 0 1 274 92" fill="none" stroke="#5c6875" stroke-width="1.5"
        marker-start="url(#ah)" marker-end="url(#ah)"/>
  <text x="82"  y="76" fill="#5c6875" font-size="12" text-anchor="middle">back</text>
  <text x="288" y="76" fill="#5c6875" font-size="12" text-anchor="middle">forward</text>

  <!-- device, side view, rocking -->
  <g class="rock">
    <rect x="110" y="150" width="150" height="26" rx="7" fill="#171c23" stroke="#29323d" stroke-width="1.5"/>
    <rect x="118" y="142" width="52" height="10" rx="3" fill="#14211b" stroke="#2a4c3c"/>
    <rect x="180" y="146" width="10" height="5" rx="2" fill="#29323d"/>
    <rect x="196" y="146" width="10" height="5" rx="2" fill="#29323d"/>
    <rect x="212" y="146" width="10" height="5" rx="2" fill="#29323d"/>
    <rect x="228" y="146" width="10" height="5" rx="2" fill="#29323d"/>
    <circle cx="250" cy="163" r="2.5" fill="#4fd68f"/>
  </g>
  <text x="185" y="210" fill="#5c6875" font-size="12" text-anchor="middle">lean the unit</text>

  <!-- morph bar -->
  <text x="380" y="96" fill="#4fd68f" font-size="14" font-weight="600">MORPH</text>
  <text x="444" y="96" fill="#aeb8c2" font-size="13">&#8212; the sound blends as you lean</text>
  <rect x="380" y="112" width="300" height="16" rx="8" fill="url(#morphbar)"/>
  <g class="blend"><circle cx="396" cy="120" r="11" fill="#0e1116" stroke="#cfd6dd" stroke-width="2"/></g>
  <text x="380" y="152" fill="#5c6875" font-size="12">the sound you were just on</text>
  <text x="680" y="152" fill="#cfd6dd" font-size="12" text-anchor="end">the live sound</text>

  <!-- second axis -->
  <path d="M380 196 q10 -12 20 0 t20 0 t20 0 t20 0" fill="none" stroke="#4fd68f" stroke-width="2"/>
  <text x="500" y="200" fill="#aeb8c2" font-size="13">left / right &#8212; vibrato</text>
  <text x="380" y="222" fill="#5c6875" font-size="12">or route either axis to wah / swell in settings</text>

  <!-- controls + the law -->
  <rect x="378" y="246" width="52" height="22" rx="5" fill="#171c23" stroke="#29323d"/>
  <text x="404" y="261" fill="#4fd68f" font-size="13" text-anchor="middle">enter</text>
  <text x="440" y="261" fill="#aeb8c2" font-size="13">tap cycles &#183; hold locks</text>
</svg>
